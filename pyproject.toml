[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-sync-tool"
version = "1.1.0"
description = "Sincronização automática de dados entre um sistema externo e uma planilha Excel de controle com múltiplas abas."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pablo Oliveira" }]
keywords = ["excel", "openpyxl", "automation", "spreadsheet", "sync"]
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/PabloHoDev/excel-sync-tool"

[project.scripts]
excel-sync = "excel_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
