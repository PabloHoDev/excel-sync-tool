[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-sync-tool"
version = "1.0.0"
description = "Sincronização automática de dados entre um sistema externo e uma planilha Excel de controle com múltiplas abas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.scripts]
excel-sync = "excel_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
